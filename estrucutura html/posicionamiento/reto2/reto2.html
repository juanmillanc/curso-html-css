<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto-2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="switch-container">
        <img class="icon-img" src="https://api.iconify.design/lucide:sun.svg?color=%2394a3b8" alt="Sol">
        <div class="pill">
            <div class="dot"></div>
        </div>
        <img class="icon-img" src="https://api.iconify.design/lucide:moon.svg?color=%2394a3b8" alt="Luna">
    </div>

    <div class="main">
        <div class="content-left">
            <div class="title1">Welcome to the</div>
            <div class="title2">Fronted Quiz!</div>
            <div class="subtitle">Pick o subject to get started.</div>
        </div>
        <div class="content-right">
            <div class="html">
                <img src="html.avif" alt="css" class="img1" width="40px ">
                <div class="sub1">HTML</div>
                
            </div>
            <div class="css">
                <img src="css.jpg" alt="css" class="img4" width="40px">
                <div class="sub2">CSS</div>
            </div>
            <div class="javascript">
                <img src="javascript.png" alt="css" class="img3" width="40px">
                <div class="sub3">Javascript</div>
            </div>
            <div class="accessibility">
                <img src="accessibility.png" alt="css" class="img4" width="40px">
                <div class="sub4">Accessibility</div>
            </div>
        </div>
    </div>

</html>
