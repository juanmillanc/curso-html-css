<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <div class="title">Registro</div>
        <label for="">Nombre</label>
        <input type="text" placeholder="Ingrese Su Nombre" required>
        <h1>hola</h1>
        <label for="">Correo</label>
        <input type="email" placeholder="Ingrese Su Correo" required>
        <label for="">Contraseña</label>
        <input type="password" placeholder="Ingrese su Contraseña" required>
        <input type="checkbox">remember
        <label for="">Fecha</label>
        <input type="date">
        <input type="radio">
        <label for="">Radio</label>
        <input type="number">
        <input type="submit">
        <button>Enviar informacion</button>
        <label for="">Departamentos Disponibles</label>
        <div class="title-selection">Departamentos Disponibles</div>
        <select name="departamentos" id="departamento">
            <option value="">Seleccione un departamento</option>
            <option value="depart-1">Venezuela</option>
            <option value="depart-2">Carepa</option>
            <option value="depart-3">Poli</option>
            <option value="depart-4">Apartado</option>
        </select>
    </form>
    
</body>
