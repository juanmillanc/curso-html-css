<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="content-left"></div>
    <form class="form-ingreso" id="miformulario" action="">
        <div class="title">DROP A LINE</div>
        <div class="inf-usuario">
            <div class="email">
                <div class="EMAIL">EMAIL</div>
                <input class="input1" type="email" placeholder="Enter a valid email address" required>
            </div>
            <div class="name">
                <div class="NAME">NAME</div>
                <input class="input2" type="text" placeholder="Enter your name" required>
            </div>
        </div>
        <div class="address">
            <div class="ADDRESS">ADDRESS</div>
            <input class="input3" type="email" placeholder="Enter your address" required>
        </div>
        <div class="message">
            <div class="MESSAGE">MESSAGE</div>
            <textarea id="message" placeholder="Enter your message"></textarea>
        </div>
        <button class="buttom" type="submit">SUBMIT</button>
        <div class="descrition">
            <div class="description-1">Images from</div>
            <div class="descrition-2">Billionphotos</div>
        </div>

    </form>
    </div>
    <div class="content-right">
        <img class="señor" src="imagen.png" alt="" width="525px">
    </div>
</body>

</html>
