<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto-3</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="content-left">
        <img class="imagen" src="imagen.jpg" alt="">
    </div>
    <div class="content-right">
        <div class="title">
            <div class="title-1">
                We can´t wait to work with you! Drop us a libe and
            </div>
            <div class="title-2">
                we´ll get back to you soon!
            </div>
        </div>
        <div class="formulario">
            <div class="name">
                <div class="NAME">NAME</div>
                <input class="input-1" type="text" placeholder="Enter your Name">
            </div>
            <div class="email">
                <div class="EMAIL">EMAIL</div>
                <input class="input-1" type="email" placeholder="Enter a valid email address">
            </div>
            <div class="message">
                <div class="MESSAGE">MESSAGE</div>
                <textarea name="message" id="" placeholder="Enter your message"></textarea>
            </div>
            <div class="CHECKBOX">
                <input class="input-2" type="checkbox">
                <div class="checkbox-1">I accept the</div>
                <div class="checkbox-2">Terms of Service</div>
            </div>
            <button class="buttom" type="submit">Submit your request</button>
            <div class="text">
                <div class="text-1">Images from</div>
                <div class="text-2">Freepik</div>
            </div>

        </div>

    </div>


</body>

</html>
