<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto-2.1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="principal">
        <div class="card-1">
            <div class="title">Your Result</div>
            <div class="circle">
                <div class="score">76</div>
                <div class="score-1">of 100</div>
            </div>
            <div class="title-2">Great</div>
            <div class="description">you scored higher than 65% of the
                people who have taken these test</div>
        </div>

        <div class="card-2">
            <div class="title-3">Summary</div>
            <div class="content">
                <div class="article1">
                    <div class="reaccion">Reaction</div>
                    <div class="puntuacion1">
                        <div class="t1">80</div>
                        <div class="t2">/100</div>
                    </div>
                </div>
                <div class="article2">
                    <div class="memory">Memory</div>
                    <div class="puntuacion2">
                        <div class="t3">80</div>
                        <div class="t4">/100</div>
                    </div>
                </div>
                <div class="article3">
                    <div class="verbal">Verbal</div>
                    <div class="puntuacion3">
                        <div class="t5">80</div>
                        <div class="t6">/100</div>
                    </div>
                </div>
                <div class="article4">
                    <div class="visual">Visual</div>
                    <div class="puntuacion4">
                        <div class="t7">80</div>
                        <div class="t8">/100</div>
                    </div>
                </div>
            </div>
            <div class="botton">Continue</div>
        </div>
    </div>
</body>

</html>
